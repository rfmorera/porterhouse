<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porterhouse</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #1f1d1a;
      --muted: #6b665e;
      --line: #e3ded4;
      --accent: #b23a2c;
      --accent-ink: #ffffff;
      --ok: #2e7d4f;
      --warn: #a66a00;
      --err: #b23a2c;
      --log-bg: #1f1d1a;
      --log-ink: #ece8df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171512;
        --panel: #221f1b;
        --ink: #ece8df;
        --muted: #a39c90;
        --line: #37322b;
        --log-bg: #0f0e0c;
        --log-ink: #ddd7cb;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { color: var(--muted); font-size: 13px; font-weight: 400; }
    input[type="file"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
    }
    .field { margin-bottom: 16px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    button {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .status { color: var(--muted); font-size: 13px; }
    pre {
      background: var(--log-bg);
      color: var(--log-ink);
      border-radius: 12px;
      padding: 16px;
      min-height: 260px;
      max-height: 60vh;
      overflow: auto;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
    .aviso { color: #f2c66d; }
    .error { color: #ff8a7a; }
    .listo { color: #8fd9a8; }
    .counts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Porterhouse</h1>
  <p class="sub">Sube el histórico de saldos del Excel como net worth manual en MondayCall.</p>

  <form id="form" class="panel">
    <div class="field">
      <label for="file">Archivo Excel <span class="hint">(.xlsx con las hojas mapeadas en sheets.json)</span></label>
      <input id="file" name="file" type="file" accept=".xlsx" required>
    </div>
    <div class="field">
      <label for="token">JWT <span class="hint" id="token-hint">(si está vacío se usa MONDAYCALL_JWT del entorno)</span></label>
      <input id="token" name="token" type="password" autocomplete="off" placeholder="eyJhbGciOi...">
    </div>
    <div class="field">
      <label for="rate">Cotización fija UYU por USD <span class="hint">(opcional; si está vacío se consulta BCU por fecha)</span></label>
      <input id="rate" name="rate" type="text" inputmode="decimal" placeholder="ej. 40.25">
    </div>
    <div class="row">
      <label class="check"><input id="dry" name="dry_run" type="checkbox" checked> Solo simular (no envía nada)</label>
      <button id="send" type="submit">Procesar</button>
      <span class="status" id="status"></span>
    </div>
  </form>

  <div class="panel">
    <label>Progreso</label>
    <pre id="log">Esperando archivo…</pre>
    <div class="counts" id="counts"></div>
  </div>
</main>
<script>
  const form = document.getElementById("form");
  const log = document.getElementById("log");
  const status = document.getElementById("status");
  const counts = document.getElementById("counts");
  const send = document.getElementById("send");

  fetch("/api/status").then(r => r.json()).then(info => {
    status.textContent = "API: " + info.api_url;
    counts.textContent = "Registro local: " + info.ledger_items + " ítems, " + info.ledger_revisions + " revisiones ya enviadas";
    document.getElementById("token-hint").textContent = info.has_env_token
      ? "(hay MONDAYCALL_JWT en el entorno; dejá vacío para usarlo)"
      : "(no hay MONDAYCALL_JWT en el entorno; pegalo acá)";
  }).catch(() => { status.textContent = "No se pudo leer /api/status"; });

  function append(line) {
    const span = document.createElement("span");
    if (line.startsWith("[aviso]")) span.className = "aviso";
    else if (line.startsWith("[error]")) span.className = "error";
    else if (line.startsWith("Listo.")) span.className = "listo";
    span.textContent = line + "\n";
    log.appendChild(span);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const data = new FormData(form);
    data.set("dry_run", document.getElementById("dry").checked ? "true" : "false");
    log.textContent = "";
    send.disabled = true;
    status.textContent = "Procesando…";
    let avisos = 0, errores = 0, lineas = 0;
    try {
      const response = await fetch("/api/sync", { method: "POST", body: data });
      if (!response.ok) {
        append("[error] " + response.status + " " + (await response.text()));
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let index;
        while ((index = buffer.indexOf("\n")) >= 0) {
          const line = buffer.slice(0, index);
          buffer = buffer.slice(index + 1);
          lineas += 1;
          if (line.startsWith("[aviso]")) avisos += 1;
          if (line.startsWith("[error]")) errores += 1;
          append(line);
        }
      }
      if (buffer) append(buffer);
    } catch (error) {
      append("[error] " + error);
      errores += 1;
    } finally {
      send.disabled = false;
      status.textContent = "Terminado: " + lineas + " líneas, " + avisos + " avisos, " + errores + " errores";
    }
  });
</script>
</body>
</html>

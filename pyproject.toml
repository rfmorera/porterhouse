[project]
name = "porterhouse"
version = "0.1.0"
description = "Sube el histórico de saldos de un Excel como net worth manual de MondayCall"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "requests>=2.32,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["porterhouse"]
